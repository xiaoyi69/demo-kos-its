<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login — KOSTRA</title>

    <meta
        name="description"
        content="Login ke akun KOSTRA."
    >

    <!-- CSS utama -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="card">

            <!-- Brand -->
            <a
                class="brand"
                href="./index.html"
            >
                <span class="brand-icon">⌂</span>
                KOSTRA
            </a>


            <!-- Heading -->
            <h1>
                Selamat datang kembali
            </h1>

            <p class="muted">
                Masuk ke akun KOSTRA.
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <label for="loginId">
                    Email / Username
                </label>

                <input
                    id="loginId"
                    name="id"
                    type="text"
                    placeholder="Ketik email atau username"
                    required
                    autocomplete="username"
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    id="loginPassword"
                    name="password"
                    type="password"
                    placeholder="Ketik password"
                    required
                    autocomplete="current-password"
                >


                <button
                    type="submit"
                    class="btn dark"
                >
                    Login
                </button>

            </form>


            <!-- Link -->
            <div class="auth-links">

                <a href="./register.html">
                    Buat akun
                </a>

                <a href="./forgot-password.html">
                    Lupa password?
                </a>

            </div>


            <!-- Message -->
            <div
                class="msg"
                id="loginMessage"
                role="alert"
            ></div>


            <!-- Demo Login -->
            <div class="demo-login">

                <small>
                    Demo:
                    <strong>demo</strong>
                    /
                    <strong>demo</strong>
                </small>

            </div>

        </div>

    </main>


    <!-- JavaScript Auth -->
    <script src="./js/auth.js"></script>

</body>
</html>
