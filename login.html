<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — NemuKos</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f7f5;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:30px;box-sizing:border-box}a{color:#111}.brand{font-weight:900;font-size:22px;text-decoration:none}.muted{color:#777}label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}.links{margin-top:18px;font-size:13px;display:flex;justify-content:space-between}.msg{margin-top:14px;font-size:13px}</style></head><body><div class="card"><a class="brand" href="/">⌂ NemuKos</a><h1>Selamat datang kembali</h1><p class="muted">Masuk ke akun NemuKos.</p><form id="f"><label>Email / Username</label><input name="id" required><label>Password</label><input name="pw" type="password" required><button>Login</button></form><div class="links"><a href="/register.html">Buat akun</a><a href="/forgot-password.html">Lupa password?</a></div><div class="msg" id="m"></div></div><script>f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),u=JSON.parse(localStorage.nemu_users||'[]');let ok=u.find(x=>(x.email===d.get('id')||x.username===d.get('id'))&&x.password===d.get('pw'));if(!ok)ok=(d.get('id')==='demo'&&d.get('pw')==='demo');if(ok){localStorage.nemu_user=JSON.stringify({username:ok.username||'Demo User',email:ok.email||'demo@nemukos.id'});location.href='/'}else m.textContent='Email/username atau password salah.'}</script></body></html>
