<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Reset Password — KOSTRA</title>

    <meta
        name="description"
        content="Atur ulang password akun KOSTRA."
    >

    <!-- CSS utama -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="card">

            <!-- Brand -->
            <a
                class="brand"
                href="./index.html"
            >
                <span class="brand-icon">⌂</span>
                KOSTRA
            </a>


            <!-- Heading -->
            <h1>
                Reset password
            </h1>

            <p class="muted">
                Buat password baru untuk akun KOSTRA Anda.
            </p>


            <!-- Reset Password Form -->
            <form id="resetForm">

                <label for="newPassword">
                    Password baru
                </label>

                <input
                    id="newPassword"
                    name="password"
                    type="password"
                    placeholder="Ketik password baru"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >


                <label for="confirmPassword">
                    Konfirmasi password
                </label>

                <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    placeholder="Ulangi password baru"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >


                <button
                    type="submit"
                    class="btn dark"
                >
                    Simpan Password
                </button>

            </form>


            <!-- Message -->
            <div
                id="resetMessage"
                class="msg"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- Back to Login -->
            <a
                class="back-link"
                href="./login.html"
            >
                ← Kembali ke login
            </a>

        </div>

    </main>


    <!-- Authentication JavaScript -->
    <script src="./js/auth.js"></script>

</body>
</html>
