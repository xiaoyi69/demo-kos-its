<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — NemuKos</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f7f5;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:30px;box-sizing:border-box}a{color:#111}.brand{font-weight:900;font-size:22px;text-decoration:none}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;font-size:13px}</style></head><body><div class="card"><a class="brand" href="/">⌂ NemuKos</a><h1>Reset password</h1><form id="f"><label>Password baru</label><input name="p" type="password" required><label>Konfirmasi</label><input name="c" type="password" required><button>Simpan Password</button></form><div id="m" class="msg"></div></div><script>f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);m.textContent=d.get('p')===d.get('c')?'Password berhasil diubah. Silakan login.':'Konfirmasi password tidak sama.';if(d.get('p')===d.get('c'))setTimeout(()=>location.href='/login.html',700)}</script></body></html>
