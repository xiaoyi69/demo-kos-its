<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Lupa Password — KOSTRA</title>

    <meta
        name="description"
        content="Reset password akun KOSTRA."
    >

    <!-- CSS utama -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="card">

            <!-- Brand -->
            <a
                class="brand"
                href="./index.html"
            >
                <span class="brand-icon">⌂</span>
                KOSTRA
            </a>


            <!-- Heading -->
            <h1>
                Lupa password?
            </h1>

            <p class="muted">
                Masukkan email akun Anda.
                Pada versi demo, link reset disimulasikan
                untuk mengarahkan Anda ke halaman
                pengaturan ulang password.
            </p>


            <!-- Forgot Password Form -->
            <form id="forgotForm">

                <label for="forgotEmail">
                    Email Terdaftar
                </label>

                <input
                    id="forgotEmail"
                    name="email"
                    type="email"
                    placeholder="nama@email.com"
                    required
                    autocomplete="email"
                >


                <button
                    type="submit"
                    class="btn dark"
                >
                    Kirim Link Reset
                </button>

            </form>


            <!-- Back -->
            <a
                class="back-link"
                href="./login.html"
            >
                ← Kembali ke login
            </a>


            <!-- Message -->
            <div
                id="forgotMessage"
                class="msg"
                role="status"
                aria-live="polite"
            ></div>

        </div>

    </main>


    <!-- Authentication JavaScript -->
    <script src="./js/auth.js"></script>

</body>
</html>
