<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lupa Password — NemuKos</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f7f5;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:30px;box-sizing:border-box}a{color:#111}.brand{font-weight:900;font-size:22px;text-decoration:none}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px;margin-top:10px}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;font-size:13px}</style></head><body><div class="card"><a class="brand" href="/">⌂ NemuKos</a><h1>Lupa password?</h1><p>Masukkan email. Pada versi demo, link reset disimulasikan.</p><form id="f"><input name="email" type="email" placeholder="nama@email.com" required><button>Kirim Link Reset</button></form><p><a href="/login.html">Kembali ke login</a></p><div id="m" class="msg"></div></div><script>f.onsubmit=e=>{e.preventDefault();m.textContent='Link reset demo sudah dikirim. Silakan login kembali.'}</script></body></html>
