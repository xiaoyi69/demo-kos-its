<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — NemuKos</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7f7f5;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:30px;box-sizing:border-box}a{color:#111}.brand{font-weight:900;font-size:22px;text-decoration:none}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;font-size:13px}</style></head><body><div class="card"><a class="brand" href="/">⌂ NemuKos</a><h1>Buat akun</h1><form id="f"><label>Username</label><input name="username" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button>Register</button></form><p><a href="/login.html">Sudah punya akun? Login</a></p><div id="m" class="msg"></div></div><script>f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let u=JSON.parse(localStorage.nemu_users||'[]');if(u.some(x=>x.email===d.email||x.username===d.username)){m.textContent='Email/username sudah terdaftar.';return}u.push(d);localStorage.nemu_users=JSON.stringify(u);m.textContent='Registrasi berhasil. Mengarahkan ke login…';setTimeout(()=>location.href='/login.html',700)}</script></body></html>
