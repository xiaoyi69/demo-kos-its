<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — KOSTRA</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #f7f7f5;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(430px, calc(100% - 32px));
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 30px;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    a {
      color: #111;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .brand {
      font-weight: 900;
      font-size: 22px;
      display: inline-block;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 20px;
      margin: 10px 0 16px;
      color: #111;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 14px 0 6px;
      color: #333;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background: #333;
    }

    p {
      margin-top: 18px;
      font-size: 13px;
      color: #666;
    }

    .msg {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .msg.error {
      color: #e53e3e;
    }

    .msg.success {
      color: #2e7d32;
    }
  </style>
</head>
<body>

  <div class="card">
    <a class="brand" href="/">⌂ KOSTRA</a>
    <h1>Buat akun</h1>

    <form id="f">
      <label for="username">Username</label>
      <input id="username" name="username" placeholder="Pilih username" required autocomplete="username">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="nama@email.com" required autocomplete="email">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Minimal 6 karakter" required autocomplete="new-password">

      <button type="submit">Register</button>
    </form>

    <p><a href="/login.html">Sudah punya akun? Login</a></p>
    <div id="m" class="msg"></div>
  </div>

  <script>
    f.onsubmit = e => {
      e.preventDefault();
      let d = Object.fromEntries(new FormData(f));
      let u = JSON.parse(localStorage.nemu_users || '[]');

      // Cek apakah username atau email sudah pernah terdaftar
      if (u.some(x => x.email === d.email || x.username === d.username)) {
        m.className = 'msg error';
        m.textContent = 'Email atau username sudah terdaftar.';
        return;
      }

      // Simpan user baru ke localStorage
      u.push(d);
      localStorage.nemu_users = JSON.stringify(u);

      m.className = 'msg success';
      m.textContent = 'Registrasi berhasil. Mengarahkan ke halaman login…';

      // Redirect otomatis ke halaman login setelah 0.7 detik
      setTimeout(() => location.href = '/login.html', 700);
    };
  </script>

</body>
</html>
